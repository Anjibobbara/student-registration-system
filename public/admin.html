<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="top-bar">

        <h1>🎓 Admin Dashboard</h1>

        <button onclick="logout()" class="logout-btn">
            Logout
        </button>

    </div>

    <div class="card">

        <h2>📋 Registered Students</h2>

        <input
        type="text"
        id="search"
        placeholder="Search by Name, Reg No or Email"
        style="margin-bottom:20px;">

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Reg No</th>
                        <th>Father Name</th>
                        <th>Mother Name</th>
                        <th>DOB</th>
                        <th>Mobile</th>
                        <th>Alt Mobile</th>
                        <th>Email</th>
                        <th>Gender</th>
                        <th>Courses</th>
                        <th>Language</th>
                        <th>Address</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="admin.js"></script>

</body>

</html>
