<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Student Registration System</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="top-bar">

    <h1>🎓 Student Registration System</h1>

    <button onclick="logout()" class="logout-btn">
        Logout
    </button>

</div>




<!-- REGISTRATION FORM -->

<div class="card">


<form id="studentForm">


<input type="hidden" id="studentId">



<div class="grid">


<div>
<label>Student Name</label>
<input type="text" id="name" placeholder="Enter name" required>
</div>


<div>
<label>Registration Number</label>
<input type="text" id="regNo" placeholder="Enter Reg No" required>
</div>


<div>
<label>Father Name</label>
<input type="text" id="fatherName" placeholder="Father name" required>
</div>


<div>
<label>Mother Name</label>
<input type="text" id="motherName" placeholder="Mother name" required>
</div>


<div>
<label>Date of Birth</label>
<input type="date" id="dob" required>
</div>


<div>
<label>Mobile Number</label>
<input type="text" id="mobile" placeholder="Mobile number" required>
</div>


<div>
<label>Alternative Mobile</label>
<input type="text" id="alternativeMobile" placeholder="Alternative number">
</div>


<div>
<label>Email</label>
<input type="email" id="email" placeholder="Email" required>
</div>



<div>
<label>Gender</label>

<select id="gender" required>

<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>



<div>

<label>Programming Language</label>

<select id="programmingLanguage" required>

<option value="">Select</option>
<option>Python</option>
<option>Java</option>
<option>JavaScript</option>
<option>C++</option>
<option>AIML</option>

</select>

</div>


</div>





<label>Courses</label>


<div class="checkbox">


<label>
<input type="checkbox" value="HTML">
HTML
</label>


<label>
<input type="checkbox" value="CSS">
CSS
</label>


<label>
<input type="checkbox" value="DBMS">
DBMS
</label>


<label>
<input type="checkbox" value="AIML">
AIML
</label>


</div>





<label>Address</label>

<textarea 
id="address"
rows="4"
placeholder="Enter address"
required></textarea>





<button type="submit" id="submitBtn">

Register Student

</button>


</form>


</div>






<!-- REGISTERED STUDENTS -->

<div class="card" id="studentsSection">

<h2>📋 Registered Students</h2>

<input 
type="text"
id="search"
placeholder="Search Student"
style="margin-bottom:20px;">





<div class="table-container">


<table>


<thead>

<tr>

<th>Name</th>

<th>Reg No</th>

<th>Father Name</th>

<th>Mother Name</th>

<th>Mobile</th>

<th>Email</th>

<th>Language</th>

<th>Courses</th>

<th>Actions</th>


</tr>


</thead>



<tbody id="studentTable">


</tbody>



</table>


</div>


</div>





</div>



<script src="script.js"></script>


</body>

</html>
