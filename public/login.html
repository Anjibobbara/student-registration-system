<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div class="card">


<h1>🔐 Admin Login</h1>


<form id="loginForm">


<label>Email</label>

<input 
type="email"
id="email"
placeholder="Enter Admin Email"
required>



<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required>



<button type="submit">
Login
</button>


</form>


</div>


</div>



<script src="login.js"></script>


</body>

</html>
