<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration Successful</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#abb1ab,#2196F3);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.container{

background:#fff;

width:90%;
max-width:500px;

padding:40px;

border-radius:15px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.2);

}

.icon{

font-size:80px;

margin-bottom:20px;

}

h1{

color:#232423;

margin-bottom:15px;

}

p{

font-size:18px;

color:#555;

margin-bottom:30px;

line-height:1.6;

}

.buttons{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}

.btn{

text-decoration:none;

padding:12px 25px;

border-radius:8px;

font-size:16px;

font-weight:600;

color:#fff;

transition:.3s;

}

.home{

background:#007bff;

}

.home:hover{

background:#0056b3;

}

.login{

background:#28a745;

}

.login:hover{

background:#1e7e34;

}

</style>

</head>

<body>

<div class="container">



<h1>Student Submitted Successfully</h1>

<p>

Thank you for submitting your registration.

Your details have been successfully recorded.

</p>

<div class="buttons">

<a href="index.html" class="btn home">
Home
</a>


</div>

</div>
